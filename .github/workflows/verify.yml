name: Verify MVP
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check algorithm fixtures
        run: sh scripts/smoke-test.sh
      - name: Build Android debug APK
        run: ./gradlew :android-app:assembleDebug :android-app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: gf-debug-apk
          path: android-app/build/outputs/apk/debug/android-app-debug.apk
          if-no-files-found: error
          retention-days: 7
